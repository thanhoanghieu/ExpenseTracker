# Expense Tracker: segmented frontend, database and monitoring networks
services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: expensetracker
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - backend-net
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_tool
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in
        .env}
    ports:
    - 192.168.77.129:5050:80
    volumes:
    - expense_pgadmin_data:/var/lib/pgadmin
    networks:
    - backend-net
  web:
    build: ./app
    container_name: expense_web_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: expensetracker
    depends_on:
    - db
    networks:
    - frontend-net
    - backend-net
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
    - 80:80
    volumes:
    - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
    - web
    networks:
    - frontend-net
    - monitor-net
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 192.168.77.129:9090:9090
    networks:
    - monitor-net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
    - 192.168.77.129:3000:3000
    volumes:
    - expense_grafana_data:/var/lib/grafana
    networks:
    - monitor-net
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
    - 192.168.77.129:3100:3100
    networks:
    - monitor-net
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
    - ./loki/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - -config.file=/etc/promtail/promtail-config.yaml
    networks:
    - monitor-net
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitor-net:
    driver: bridge
volumes:
  pgdata: null
  expense_grafana_data:
    external: true
  expense_pgadmin_data:
    external: true
